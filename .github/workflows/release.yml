name: Package prerelease
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 2.1.0-rainmeter.1'
        required: true
        default: '2.1.0-rainmeter.1'
  push:
    tags: ['v*-rainmeter.*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Regression checks
        shell: pwsh
        run: |
          dotnet run --project tests/MonitorRegression/MonitorRegression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/RainmeterRegression/RainmeterRegression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package both runtime variants
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) { $version = $env:TAG_NAME -replace '^v', '' }
          ./scripts/Package.ps1 -Version $version
      - name: Per-user installation smoke test
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts -Directory -Filter 'staging-self-contained-*' | Select-Object -First 1
          ./scripts/Test-Install.ps1 -PackageDirectory $package.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSound-Rainmeter-packages
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
